---
- name: Configure and deploy platform application
  hosts: platform
  become: true

  vars:
    app_name: demo-app
    app_image: platform-lab-app:dev
    app_port: 8000

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/platform-app
        state: directory
        mode: '0755'

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Pull application image
      community.docker.docker_image:
        name: "{{ app_image }}"
        source: pull

    - name: Run application container
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:{{ app_port }}"
