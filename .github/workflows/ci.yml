name: Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ---------------------------------------------------------
  # Validation
  # ---------------------------------------------------------

  validate:
    name: Validate Platform
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Python
      # -----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Validate Python CLI
        run: |
          python -m py_compile cli/platform.py
          python -m py_compile cli/kubernetes.py

      - name: Run Python tests
        run: |
          pytest

      - name: Validate platform configuration
        run: |
          python cli/platform.py validate config/app.yaml --env dev


      # -----------------------------------------------------
      # Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


      # -----------------------------------------------------
      # Kubernetes
      # -----------------------------------------------------

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          import yaml

          files = [
              "kubernetes/deployment.yaml",
              "kubernetes/service.yaml",
              "kubernetes/secret.yaml",
          ]

          for file in files:
              with open(file, "r") as f:
                  yaml.safe_load(f)

              print(f"Valid YAML: {file}")
          PY


      # -----------------------------------------------------
      # Docker
      # -----------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t platform-lab-app:${{ github.sha }} \
            ./app


  # ---------------------------------------------------------
  # Publish Docker image
  # ---------------------------------------------------------

  publish:
    name: Publish Container Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    needs:
      - validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set image name
        id: image
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }} \
            ./app

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }}

      - name: Display published image
        run: |
          echo "Published image: ${{ steps.image.outputs.image }}"