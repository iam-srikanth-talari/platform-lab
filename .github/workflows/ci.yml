name: Platform CI

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ---------------------------------------------------------
  # Validation
  # ---------------------------------------------------------

  validate:
    name: Validate Platform
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Python
      # -----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Validate Python CLI
        run: |
          python -m py_compile cli/platform.py
          python -m py_compile cli/kubernetes.py

      - name: Run Python tests
        run: |
          pytest

      - name: Validate platform configuration
        run: |
          python cli/platform.py validate config/app.yaml --env dev


      # -----------------------------------------------------
      # Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


      # -----------------------------------------------------
      # Kubernetes
      # -----------------------------------------------------

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          import yaml

          files = [
              "kubernetes/deployment.yaml",
              "kubernetes/service.yaml",
              "kubernetes/secret.yaml",
          ]

          for file in files:
              with open(file, "r") as f:
                  yaml.safe_load(f)

              print(f"Valid YAML: {file}")
          PY


      # -----------------------------------------------------
      # Docker
      # -----------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t platform-lab-app:${{ github.sha }} \
            ./app


  # ---------------------------------------------------------
  # Publish Docker image
  # ---------------------------------------------------------

  publish:
    name: Publish Container Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    needs:
      - validate

    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set image name
        id: image
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }} \
            ./app

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }}

      - name: Display published image
        run: |
          echo "Published image: ${{ steps.image.outputs.image }}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    needs:
      - publish

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::750708765726:role/demo-app-${{ inputs.environment || 'dev' }}-github-actions-role
          aws-region: ap-south-2

      - name: Discover EC2 instance
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=platform-app" \
              "Name=tag:Environment,Values=${ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --region ap-south-2 \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running platform-app instance found for environment: $ENVIRONMENT"
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Discovered EC2 instance: $INSTANCE_ID"
          echo "Environment: $ENVIRONMENT"

      - name: Deploy to EC2 through SSM
        env:
          # INSTANCE_ID: i-0d924610eff1ce3e8
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          cat > commands.json <<EOF
          {
            "commands": [
              "sudo systemctl enable docker",
              "sudo systemctl start docker",
              "sudo docker pull ${IMAGE}",
              "sudo docker rm -f demo-app || true",
              "sudo docker run -d --name demo-app --restart unless-stopped -p 8000:8000 ${IMAGE}",
              "sudo docker ps",
              "for i in {1..12}; do if curl -fsS http://localhost:8000/health; then exit 0; fi; sleep 2; done; exit 1"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --region ap-south-2 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-south-2 \
              --query "Status" \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region ap-south-2 \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region ap-south-2 \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "SSM deployment timed out"
          exit 1
