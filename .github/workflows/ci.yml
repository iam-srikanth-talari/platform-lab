name: Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Validate Python CLI
        run: |
          python -m py_compile cli/platform.py
          python -m py_compile cli/kubernetes.py

      - name: Run Python tests
        run: |
          pytest

      - name: Validate platform configuration
        run: |
          python cli/platform.py validate config/app.yaml --env dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              "kubernetes/deployment.yaml",
              "kubernetes/service.yaml",
              "kubernetes/secret.yaml",
          ]

          for file in files:
              with open(file, "r") as f:
                  yaml.safe_load(f)
              print(f"Valid YAML: {file}")
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }} \
            ./app

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/platform-lab-app:${{ github.sha }}